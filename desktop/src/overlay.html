<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>camargo overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    #badges {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .aram-badge {
      position: absolute;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1b1b20e6;
      color: #f2f2f4;
      border: 1px solid #38383f;
      border-radius: 8px;
      padding: 4px 10px 4px 4px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .aram-badge.is-best {
      border-color: #6d8bff;
      box-shadow: 0 0 0 2px rgba(109, 139, 255, 0.35), 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .aram-badge-icon {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: cover;
      display: block;
    }

    .aram-badge-tier {
      font-size: 11px;
      font-weight: 700;
      color: #8b8b93;
    }

    .aram-badge-unknown {
      color: #8b8b93;
      font-style: italic;
      font-weight: 500;
    }

    .aram-badge.is-best .aram-badge-tier {
      color: #7f9aff;
    }
  </style>
</head>
<body>
  <div id="badges"></div>
  <script src="overlay.js"></script>
</body>
</html>
