<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <!-- This window renders remote, scrape-derived icon URLs (augment icons
       from Community Dragon) with no other validation - unlike index.html,
       it had no CSP at all. Restricted to exactly the one host it actually
       loads images from; it never fetches anything else itself. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://raw.communitydragon.org; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>camargo overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    #badges {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* Anchored by `bottom` (set in overlay.js) so the box grows upward
       from just above the card, regardless of how many lines the
       justification wraps to - no height calc needed in JS. */
    .aram-badge {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 190px;
      background: #1b1b20e6;
      color: #f2f2f4;
      border: 1px solid #38383f;
      border-radius: 8px;
      padding: 6px 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .aram-badge.is-best {
      border-color: #6d8bff;
      box-shadow: 0 0 0 2px rgba(109, 139, 255, 0.35), 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    /* A rarity-based guess (no OP.GG data for any of the 3 cards) still
       points at something, but must never read as the same solid-blue,
       data-backed highlight above - dashed and amber instead of solid
       and blue, so it's recognizable as a lower-confidence pick from
       across the screen, not just from the "Guess" label up close. */
    .aram-badge.is-best.is-guess {
      border-color: #f0a830;
      border-style: dashed;
      box-shadow: 0 0 0 2px rgba(240, 168, 48, 0.28), 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .aram-badge-header {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .aram-badge-icon {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      object-fit: cover;
      display: block;
      flex: 0 0 auto;
    }

    .aram-badge-name {
      font-size: 13px;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1 1 auto;
      min-width: 0;
    }

    .aram-badge-unknown {
      color: #8b8b93;
      font-style: italic;
      font-weight: 500;
    }

    .aram-badge-rank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 5px;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #05070f;
      background: #8b8b93;
      flex: 0 0 auto;
    }
    /* OP is rarer than S (the very best of an already-elite tier), so it
       gets a hotter color; S is rare on its own - roughly 5% of a
       champion's pool - so it gets the gold. */
    .aram-badge-rank.rank-op { background: #ff6b4a; }
    .aram-badge-rank.rank-s { background: #f0c040; }
    .aram-badge-rank.rank-a { background: #6d8bff; }
    .aram-badge-rank.rank-b { background: #6f7079; color: #e8e8ec; }
    /* Deliberately not a solid fill like OP/S/A/B above - an outline in
       the same amber as the card border (see .is-guess) reads as "not a
       real grade" even at a glance, before the "Guess" text registers. */
    .aram-badge-rank.rank-guess {
      background: transparent;
      border: 1.5px dashed #f0a830;
      color: #f0a830;
    }

    .aram-badge-justification {
      font-size: 11px;
      font-weight: 500;
      line-height: 1.35;
      color: #b8b8bf;
    }
  </style>
</head>
<body>
  <div id="badges"></div>
  <script src="overlay.js"></script>
</body>
</html>
