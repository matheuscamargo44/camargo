name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # `dist` runs electron-builder with --publish never. package.json does
      # carry a `publish` block, but only so electron-builder emits
      # latest.yml and app-update.yml, which the in-app updater needs to
      # find releases. Without --publish never, electron-builder treats a CI
      # tag build as a request to publish and fails for want of a GH_TOKEN;
      # the upload is the next step's job.
      - name: Build backend executable and installer
        working-directory: desktop
        run: npm run dist

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml is the feed electron-updater reads to discover new
          # versions; without it the in-app updater can never see a release.
          # The blockmap lets it download only the changed chunks instead of
          # the whole ~110MB installer.
          files: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml
          generate_release_notes: true
