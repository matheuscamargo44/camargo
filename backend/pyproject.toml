[project]
name = "camargo"
version = "0.1.0"
description = "League of Legends (LCU) and VALORANT toolkit - backend service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psutil==7.1.3",
    "requests==2.32.5",
    "urllib3==2.5.0",
    "valclient>=2.28",
    "mss>=9.0.2",
    "Pillow>=10.4.0",
    "numpy>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "httpx>=0.27.0",
    "pyinstaller>=6.22.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "e2e: real feature code + real background threads + a real HTTP server (fake LCU) - slower (~10s) than the rest of the suite combined. Run everything with `pytest`; skip these for a fast local loop with `pytest -m 'not e2e'`.",
]
